name: PR 검증

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: 앱 타입 및 Jest
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 앱 의존성 설치
        run: npm ci

      - name: TypeScript 검사
        run: npx tsc --noEmit

      - name: App Jest 실행
        run: npm test -- --runInBand --watchman=false

  server:
    name: 서버 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 서버 의존성 설치
        run: npm ci

      - name: 서버 테스트 실행
        run: npm test

  web:
    name: 웹 빌드 및 회귀 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - name: 웹 회귀 테스트
        run: |
          node scripts/test-goal-progress.cjs
          node scripts/test-home-shortcuts.cjs
          node scripts/test-web-theme.cjs
          node scripts/test-login-destination.cjs
